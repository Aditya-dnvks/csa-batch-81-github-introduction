<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="description" content="ergergerfg" />
    <meta http-equiv="Content-Type" content="text/html;charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="IE=7" />
    <link rel="stylesheet" href="flex.css" />
    <link href="https://fonts.cdnfonts.com/css/gilroy-bold" rel="stylesheet" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <title>CSA</title>
  </head>
  <body>
    <nav class="navbar navbar-expand-lg navbar-custom">
      <div class="container-fluid d-flex justify-content-between">
        <div class="logo-container">
          <img
            src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_660/RX_THUMBNAIL/IMAGES/VENDOR/2024/4/8/c4500379-b463-4357-8b9b-b057a9324b54_812299.jpg"
            class="logo"
          />
          <b>Swiggy</b>
        </div>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarSupportedContent"
          aria-controls="navbarSupportedContent"
          aria-expanded="false"
          aria-label="Toggle navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse x" id="navbarSupportedContent">
          <ul class="me-auto mb-2 mb-lg-0 d-flex justify-content-end">
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="./index.html"
                >Home</a
              >
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./flex.html">Form</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="./e-commerce.html">E commerce</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
    <section class="d-flex flex-column align-items-center mt-5">
      <form
        class="d-flex flex-column align-items-center bg-warning border-1 rounded-2 w-25 shadow-lg p-4"
        id="form"
      >
        <h4 class="text-decoration-underline"><strong>User Form</strong></h4>

        <div class="d-flex flex-column my-1 w-75">
          <label for="name" class="form-label"><b>Name</b></label>
          <input
            type="text"
            class="rounded-3 border-0 p-1 mt-1"
            id="name"
            name="name"
          />
        </div>

        <div class="d-flex flex-column my-1 w-75">
          <label for="city" class="form-label"><b>City</b></label>
          <input
            type="text"
            class="rounded-3 border-0 p-1 mt-1"
            id="city"
            name="city"
          />
        </div>

        <div class="d-flex flex-column my-1 w-75">
          <label for="imgUrl" class="form-label"><b>Image</b></label>
          <input
            type="url"
            class="rounded-3 border-0 p-1 mt-1"
            id="imgUrl"
            name="imgUrl"
          />
        </div>

        <div class="d-flex flex-column my-1 w-75">
          <label for="occupation" class="form-label"><b>Occupation</b></label>
          <input
            type="text"
            class="rounded-3 border-0 p-1 mt-1"
            id="occupation"
            name="occupation"
          />
        </div>

        <button class="btn btn-primary my-3">Submit</button>
      </form>
    </section>

    <div
      id="card-container"
      class="d-flex justify-content-center flex-wrap gap-4"
    ></div>

    <script src="./flex.js"></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
